<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Mock Test</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
      .auth-container { max-width:400px; margin:40px auto; background:white; padding:24px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1) }
      .form-group { margin-bottom:16px }
      .form-group label { display:block; margin-bottom:6px; font-weight:bold }
      .form-group input { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box }
      .btn-primary { width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer; font-size:16px }
      .btn-primary:hover { background:#218838 }
      .error { color:#c82333; margin-bottom:12px; padding:8px; background:#f8d7da; border-radius:4px }
      .link { text-align:center; margin-top:12px }
      .link a { color:#2c8ebb; text-decoration:none }
      h1 { text-align:center; color:#333 }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h1>BIPARD Mock Test</h1>
      <h2 style="text-align:center; font-size:18px; color:#666">Sign Up</h2>
      
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      
      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password (min 4 chars)</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" name="confirm" required>
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
      </form>
      
      <div class="link">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
      </div>
    </div>
  </body>
</html>
